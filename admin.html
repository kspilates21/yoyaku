<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>今日のお客様</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --bg: #f6f5f1; --card: #fff; --ink: #2f3a33; --muted: #7a847d; --line: #e4e2db;
    --accent: #5f7f68; --accent-ink: #fff; --soft: #e8efe9; --warn: #b5643f; --warn-soft: #f8ece6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 16px; line-height: 1.6; }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 20px; margin: 4px 0 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .tabs { display: flex; gap: 8px; margin: 8px 0 12px; }
  .tabs button { flex: 1; background: var(--card); border: 1px solid var(--line); color: var(--ink); }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 10px 14px; cursor: pointer; }
  button:disabled { opacity: .5; }
  .reload { background: transparent; color: var(--accent); padding: 4px 0; font-size: 14px; }
  .time { font-size: 20px; font-weight: 700; min-width: 64px; }
  .name { font-size: 18px; font-weight: 700; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 10px; background: var(--soft); color: var(--accent); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
  .tag.done { background: var(--accent); color: var(--accent-ink); }
  .ticket { margin-top: 6px; }
  .note { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 15px; }
  .note .clip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .note .day { color: var(--muted); font-size: 13px; }
  .older { margin-top: 8px; }
  .acts { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .primary { background: var(--accent); color: var(--accent-ink); width: 100%; font-weight: 600; padding: 12px 16px; }
  .outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); width: 100%; }
  .quiet { background: transparent; color: var(--warn); font-size: 14px; padding: 4px 0; }
  textarea { width: 100%; min-height: 120px; font: inherit; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .center { text-align: center; padding: 48px 0; }
  .demo { background: var(--warn-soft); color: var(--warn); font-size: 13px; padding: 6px 10px; border-radius: 8px; margin-bottom: 12px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 24px; max-width: 488px; margin: 0 auto; background: var(--ink); color: #fff;
    padding: 12px 16px; border-radius: 12px; font-size: 15px; opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: flex-end; justify-content: center; padding: 16px; }
  .modal.show { display: flex; }
  .sheet { background: var(--card); border-radius: 16px; padding: 20px 16px 16px; width: 100%; max-width: 488px; max-height: 80vh; overflow: auto; }
  .sheet .actions { display: flex; gap: 8px; margin-top: 16px; }
  .sheet .actions button { flex: 1; }
  .cancel-btn { background: var(--soft); color: var(--ink); }
  .preview { white-space: pre-wrap; background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-top: 8px; font-size: 15px; }
</style>
</head>
<body>
<main id="app"><div class="center muted">読み込み中…</div></main>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
// 白花さんの管理画面。見る・受講済にする・取り消す・カルテを書く（2026-10-26〜）。作り方.md の「白花さんの管理画面」
const CONFIG = {
  LIFF_ID: '2012122503-nj9FTrLu',  // LINE Developers で作った「管理画面」用の LIFF ID（お客様の画面とは別・2026-10-26）
  API_URL: 'https://script.google.com/macros/s/AKfycby9YSQQD-oZrZcLHkX0AXrpJYNrxFB2-smI0yVLpYZcgHnY3nyffpC764c-BJEDLKCgRQ/exec',  // index.html と同じ
};

const params = new URLSearchParams(location.search);
const MOCK = params.get('mock'); // ?mock=1 で、架空のお客様で試せる（シートには行かない）
let idToken = null;
let offset = 0;
let busy = false;
const opened = new Set();  // 開いているカード（更新しても開いたまま）
const drafts = {};         // 書きかけのカルテ {key: {text, reqId}}。保存に失敗しても消さない

const $app = document.getElementById('app');
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => k.startsWith('on') ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v));
  kids.flat().forEach(k => k != null && e.append(k instanceof Node ? k : document.createTextNode(String(k))));
  return e;
};
const show = (...nodes) => {
  const banner = MOCK ? el('div', { class: 'demo' }, '見本：架空のお客様です（シートには書きません）') : null;
  $app.replaceChildren(...[banner, nodes].flat(Infinity).filter(n => n != null));
};
const newId = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10));
const keyOf = l => l.target.date + ' ' + l.target.time + ' ' + l.target.name;

function toast(text) {
  const t = document.getElementById('toast');
  t.textContent = text; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 3000);
}

// 確かめる画面。OK なら true
function ask(title, body, okLabel) {
  return new Promise(resolve => {
    const m = document.getElementById('modal');
    const done = v => { m.classList.remove('show'); resolve(v); };
    document.getElementById('sheet').replaceChildren(...[
      el('div', { style: 'font-size:18px;font-weight:700' }, title),
      body,
      el('div', { class: 'actions' },
        el('button', { class: 'cancel-btn', onclick: () => done(false) }, 'もどる'),
        el('button', { class: 'primary', onclick: () => done(true) }, okLabel)),
    ].flat());
    m.classList.add('show');
  });
}

async function api(action, data) {
  if (MOCK) return mockApi(action, data);
  const res = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, idToken }, data)) });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

async function start() {
  try {
    if (!MOCK) {
      if (!CONFIG.LIFF_ID) return show(el('div', { class: 'card' }, '設定がまだです（LIFF_ID が空です）'));
      await liff.init({ liffId: CONFIG.LIFF_ID });
      if (!liff.isLoggedIn()) return liff.login();
      idToken = liff.getIDToken();
    }
    load(0);
  } catch (e) {
    show(el('div', { class: 'card' }, e.message || '読み込めませんでした'));
  }
}

async function load(n, quiet) {
  offset = n;
  if (!quiet) show(header(null), el('div', { class: 'center muted' }, '読み込み中…'));
  try {
    render(await api('adminDay', { offset: n }));
  } catch (e) {
    show(header(null), el('div', { class: 'card' }, e.message || '読み込めませんでした'));
  }
}

// 書く操作。終わったら一覧を読み直す（シートの今の状態を出す）
async function write(action, data) {
  if (busy) return false;
  busy = true;
  document.querySelectorAll('.acts button').forEach(b => { b.disabled = true; });
  let ok = false;
  try {
    const r = await api(action, data);
    toast(r.message);
    ok = true;
  } catch (e) {
    toast(e.message || 'うまく保存できませんでした。もう一度お試しください');
  }
  busy = false;
  await load(offset, true);
  return ok;
}

function header(data) {
  const tab = (n, label) => el('button', { class: n === offset ? 'on' : '', onclick: () => load(n) }, label);
  const pays = data ? data.lessons.filter(l => l.pay.kind === 'pay' || l.pay.kind === 'check').length : 0;
  return [
    el('div', { class: 'row' },
      el('h1', {}, data ? data.day + ' のお客様' : 'お客様'),
      el('button', { class: 'reload', onclick: () => load(offset) }, '更新')),
    el('div', { class: 'tabs' }, tab(0, '今日'), tab(1, '明日')),
    data ? el('div', { class: 'muted', style: 'margin-bottom:10px' },
      data.lessons.length + '名' + (pays ? '（お支払い・確認 ' + pays + '）' : '')) : null,
  ];
}

function ticketText(l) {
  if (!l.type) return 'チケット未入力';
  if (!l.count) return l.type;
  const no = l.no ? '　' + l.no + '/' + l.count + '回目' : '';
  const after = l.after != null ? '　残り' + l.after + '回' : '';
  return l.type + no + after;
}

function lessonCard(l) {
  const key = keyOf(l);
  const open = opened.has(key);
  const first = l.notes[0];
  const when = l.target.date.slice(5) + ' ' + (l.time || '');
  const tags = [
    l.state === '受講済' ? el('span', { class: 'tag done' }, '受講済') : l.state !== '予約' ? el('span', { class: 'tag' }, l.state) : null,
    l.pay.kind === 'pay' ? el('span', { class: 'tag warn' }, l.pay.label) : null,
    l.pay.kind === 'check' ? el('span', { class: 'tag warn' }, '要確認：' + l.pay.label) : null,
    l.pay.kind === 'paid' ? el('span', { class: 'tag' }, l.pay.label) : null,
    l.last ? el('span', { class: 'tag warn' }, '最終回（口頭でご案内）') : null,
  ].filter(Boolean);

  const notes = el('div', { class: 'note' },
    first
      ? [el('div', { class: 'day' }, '前回 ' + first.day), el('div', { class: open ? '' : 'clip' }, first.memo)]
      : el('div', { class: 'muted' }, 'カルテ：メモなし'),
    open ? l.notes.slice(1).map(n => el('div', { class: 'older' }, el('div', { class: 'day' }, n.day), el('div', {}, n.memo))) : null,
    !open ? el('div', { class: 'muted' }, 'タップで開く') : null);

  return el('div', { class: 'card', onclick: () => { open ? opened.delete(key) : opened.add(key); rerender(); } },
    el('div', { class: 'row' },
      el('div', { class: 'time' }, l.time || '時間未入力'),
      el('div', { class: 'name' }, l.name)),
    el('div', { class: 'ticket muted' }, ticketText(l)),
    tags.length ? el('div', { class: 'tags' }, tags) : null,
    l.memo ? el('div', { class: 'muted' }, 'シートのメモ：' + l.memo) : null,
    notes,
    open ? actions(l, when) : null);
}

// 開いたカードの下：受講済にする／取り消す／カルテを書く
function actions(l, when) {
  const key = keyOf(l);
  const box = el('div', { class: 'acts', onclick: e => e.stopPropagation() });
  const d = drafts[key];
  if (l.canDone) box.append(el('button', { class: 'primary', onclick: async () => {
    const yes = await ask('受講済にしますか？', el('div', { class: 'muted', style: 'margin-top:6px' }, l.name + ' 様　' + when + '　' + ticketText(l)), '受講済にする');
    if (yes) write('adminDone', { target: l.target, reqId: newId() });
  } }, '受講済にする'));
  if (!d) box.append(el('button', { class: 'outline', onclick: () => { drafts[key] = { text: '', reqId: newId() }; rerender(); } }, 'カルテを書く'));
  if (d) {
    const area = el('textarea', { placeholder: 'キーボードのマイクを押して話すと入力できます' });
    area.value = d.text;
    area.addEventListener('input', () => { d.text = area.value; });
    box.append(area,
      el('div', { class: 'hint' }, '体の状態は「場所と程度・配慮」／病気・ケガは診断名まで（病院名・薬・数値は書かない）／会話は次回の声かけに使うものだけ1文／電話番号・住所は書かない'),
      el('button', { class: 'primary', onclick: async () => {
        const text = area.value.trim();
        if (!text) return toast('メモが空です');
        const yes = await ask('カルテに保存しますか？',
          [el('div', { class: 'muted', style: 'margin-top:6px' }, l.name + ' 様　' + when), el('div', { class: 'preview' }, text)], '保存する');
        if (!yes) return;
        if (await write('adminNote', { target: l.target, memo: text, reqId: d.reqId })) delete drafts[key];
        rerender();
      } }, '保存'),
      el('button', { class: 'quiet', onclick: () => { delete drafts[key]; rerender(); } }, '書くのをやめる'));
  }
  if (l.canUndo) box.append(el('button', { class: 'quiet', onclick: async () => {
    const yes = await ask('受講済を取り消しますか？', el('div', { class: 'muted', style: 'margin-top:6px' }, l.name + ' 様　' + when + '（予約に戻します）'), '取り消す');
    if (yes) write('adminUndo', { target: l.target, reqId: newId() });
  } }, '受講済を取り消す'));
  return box;
}

let last = null;
function render(data) { last = data; rerender(); }
function rerender() {
  if (!last) return;
  show(header(last),
    last.lessons.length ? last.lessons.map(lessonCard) : el('div', { class: 'card muted' }, 'レッスンはありません'));
}

// ---- 見本（?mock=1）。架空のお客様。シートには行かない ----
const mockData = (() => {
  const d = new Date();
  const ymd = x => x.getFullYear() + '/' + ('0' + (x.getMonth() + 1)).slice(-2) + '/' + ('0' + x.getDate()).slice(-2);
  const t = (time, name) => ({ row: 0, date: ymd(d), time, name });
  return [
    { time: '9:00', name: '山田 花子', type: 'プライベート4回券', state: '予約', memo: '', no: 4, count: 4, after: 0, last: true,
      pay: { kind: 'none', label: '' }, notes: [{ day: '10/20(火)', memo: '右肩の前だけ伸ばすように。' }], target: t('9:00', '山田 花子') },
    { time: '12:00', name: '佐藤 京', type: 'プライベート10回券', state: '予約', memo: '', no: 1, count: 10, after: 9, last: false,
      pay: { kind: 'pay', label: 'お支払い（プライベート10回券）' },
      notes: [{ day: '10/25(日)', memo: '腹筋が良くなり、太もも前の使い方も良くなってきた。課題はハムストリング・臀筋の弱さと、両腕を後ろに引いたときの肩の硬さ。次回は腕を後ろに引く動き。' },
        { day: '10/17(土)', memo: '骨盤をやや後傾でキープ。' }], target: t('12:00', '佐藤 京') },
    { time: null, name: '田中 新', type: '体験', state: '予約', memo: '予約ページから', no: null, count: null, after: null, last: false,
      pay: { kind: 'pay', label: 'お支払い（体験）' }, notes: [], target: t('', '田中 新') },
  ];
})();
function mockApi(action, data) {
  const d = new Date(); d.setDate(d.getDate() + (action === 'adminDay' ? data.offset : 0));
  const day = (d.getMonth() + 1) + '/' + d.getDate() + '(' + '日月火水木金土'[d.getDay()] + ')';
  const find = () => mockData.find(l => l.target.name === data.target.name);
  if (action === 'adminDone') { find().state = '受講済'; return { message: data.target.name + ' 様を受講済にしました（見本）' }; }
  if (action === 'adminUndo') { find().state = '予約'; return { message: data.target.name + ' 様を予約に戻しました（見本）' }; }
  if (action === 'adminNote') { find().notes.unshift({ day: '今日', memo: data.memo }); return { message: data.target.name + ' 様のカルテを保存しました（見本）' }; }
  if (data.offset === 1) return { day, offset: 1, lessons: [] };
  mockData.forEach(l => { l.canDone = l.state === '予約'; l.canUndo = l.state === '受講済'; });
  return { day, offset: 0, lessons: mockData };
}

start();
</script>
</body>
</html>
